services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE}
      POSTGRES_USER: ${PGUSER:?Set PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      LAB_LOCAL_DEV: "1"
      LAB_SIMULATOR_DISPATCH: ${LAB_SIMULATOR_DISPATCH:-0}
      LAB_SECRET_KEY: ${LAB_SECRET_KEY:?Set LAB_SECRET_KEY}
      LAB_DB: postgres
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE}
      PGUSER: ${PGUSER:?Set PGUSER}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - lab_local:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: [simulator]
    command: ["python", "web/manage.py", "scheduler", "--confirm-simulated", "--iterations", "1000", "--interval", "1"]
    environment:
      LAB_LOCAL_DEV: "1"
      LAB_SIMULATOR_DISPATCH: "1"
      LAB_SECRET_KEY: ${LAB_SECRET_KEY:?Set LAB_SECRET_KEY}
      LAB_DB: postgres
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE}
      PGUSER: ${PGUSER:?Set PGUSER}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - lab_local:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
volumes:
  lab_pgdata:
  lab_local:
